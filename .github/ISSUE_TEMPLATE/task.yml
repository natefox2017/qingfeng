name: 原子开发/美术/QA 任务
description: 独立交付目标；所有任务必须先在 GitHub 去重
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issue 负责完整 TODO，正式 Todoist Board 只负责领取和状态：
        https://app.todoist.com/app/project/6hj76M7Ghj5pR3xm
        建立 Issue 后先去重，再对应 1 张 Todoist 卡；未满足 Ready 条件先放 Backlog。
        AI 只能从 Ready 移至 In Progress 并立即回读才可开工；不依赖 Todoist assignee。
        Done 仅移动 Section，不点击 Todoist 完成，卡片保留可见。
        下列十项必须让没有历史聊天的 AI 能独立执行和验收；不适用写“不适用”，不确定写“待核实”。
  - type: textarea
    id: background
    attributes:
      label: 1. 背景
      description: 真实问题、原因与用户影响
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: 2. 目标
      description: 独立可交付成果及预期效果；包含唯一 Task ID
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 3. 当前状态
      description: 已实现代码、现存缺口、仓库基线 SHA 或待核实
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 4. 修改范围
      description: 真实文件路径、模块/页面/接口/数据结构；不适用请注明
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 5. 具体要求
      description: 输入输出、交互流程、边界、错误/取消和数据流
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 6. 技术约束
      description: 架构、兼容性、禁止修改文件、合法复用与安全边界
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 7. 依赖关系
      description: 父子 Issue、前置 Issue/PR、权威规格；未解决依赖不能 Ready
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 8. 验收标准（Checkbox）
      description: 必须填写可客观验证且能够失败的 - [ ]；禁止空泛的“通过测试”
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 9. 测试要求
      description: 测试命令、场景、预期结果、失败判定；未运行写 NOT RUN
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 10. 交付要求
      description: 独立 PR/Commit 或研究证据、原始日志、关联 Issue 及 Todoist 回写要求
    validations:
      required: true
