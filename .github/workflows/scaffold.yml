name: Scaffold checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate repository identity, docs, task graph and asset records
        run: python3 tools/check_scaffold.py
      - name: Test the checker itself
        run: python3 -m unittest discover -s tools/tests -v
