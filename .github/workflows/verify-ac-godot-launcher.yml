name: AC launcher validation (one-time)
on:
  push:
    branches: [fix/launcher-discover-preinstalled-godot]
    paths:
      - '.github/workflows/verify-ac-godot-launcher.yml'
      - 'tools/runtime.py'
      - 'tools/tests/test_runtime.py'
      - 'README.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check the automatic discovery regression tests
        run: |
          python3 tools/check_scaffold.py
          python3 -m unittest discover -s tools/tests -v
      - name: Install exact pinned Godot for isolated CI evidence
        run: python3 tools/install_engine.py --directory .local/godot
      - name: Use run_game.sh without GODOT_BIN or --godot
        run: |
          unset GODOT_BIN
          ./run_game.sh --test --report-dir reports/ac-launcher --timeout 90
      - name: Preserve test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-launcher-receipt
          path: reports/ac-launcher/
          retention-days: 7
