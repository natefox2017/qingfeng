name: Phase 0 native evidence
# Not a per-PR required check: deliberately opt-in, plus this dedicated validation branch.
on:
  workflow_dispatch:
  push:
    branches: [verify/phase0-run-game-native]

permissions:
  contents: read

jobs:
  phase0-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_SILENCE_ROOT_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository and install exact Godot build
        run: |
          python3 tools/check_scaffold.py
          python3 -m unittest discover -s tools/tests -v
          python3 tools/install_engine.py --directory .local/godot
          echo "GODOT_BIN=$GITHUB_WORKSPACE/.local/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Native cold import and full headless regressions
        run: |
          python3 tools/runtime.py test --report-dir reports/runtime --timeout 90
      - name: Capture 1280/1920 actual Godot farm images
        run: |
          mkdir -p reports/native
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 120s "$GODOT_BIN" --path game --script res://tests/page_capture.gd -- "$GITHUB_WORKSPACE/reports/native" | tee reports/native_capture.log
          test "${PIPESTATUS[0]}" -eq 0
          test -s reports/native/phase0_farm_1280.png
          test -s reports/native/phase0_farm_1920.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for width, height in ((1280, 720), (1920, 1080)):
              path = Path(f"reports/native/phase0_farm_{width}.png")
              data = path.read_bytes()
              assert data[:8] == b"\\x89PNG\\r\\n\\x1a\\n" and data[12:16] == b"IHDR", path
              actual = struct.unpack(">II", data[16:24])
              assert actual == (width, height), (path, actual)
              print(f"NATIVE_IMAGE_PASS {path} size={actual} bytes={len(data)}")
          PY
      - name: Publish evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-evidence
          path: |
            reports/
          if-no-files-found: warn
          retention-days: 7
