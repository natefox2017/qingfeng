name: Bundle P0 CJK font (one-time branch)
on:
  push:
    branches:
      - fix/n07-phase0-cjk-compact-hud
    paths:
      - .github/workflows/bundle-p0-font.yml
      - tools/bundle_noto_cjk.py
      - game/ui/theme/ui_theme.gd
      - game/ui/pages/menu_view.gd
      - game/tests/hud_quickbar_test.gd

permissions:
  contents: write

concurrency:
  group: font-p0-source-branch
  cancel-in-progress: true

jobs:
  verify-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Import signed-off immutable OFL font from publisher
        run: |
          python3 tools/bundle_noto_cjk.py
          python3 tools/check_scaffold.py
          python3 -m unittest discover -s tools/tests -q
      - name: Pin Godot and run all engine regression suites
        run: |
          python3 tools/install_engine.py --directory .local/godot
          echo "GODOT_BIN=$GITHUB_WORKSPACE/.local/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Cold farm smoke and complete game regressions
        run: |
          ./run_game.sh --test --report-dir reports/phase0 --timeout 90
          ./run_game.sh --test-all --report-dir reports/runtime --timeout 90
      - name: Capture two actual resolution screenshots (before commit)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./run_game.sh --capture "$GITHUB_WORKSPACE/reports/native" | tee reports/native-log.txt
      - name: Preserve screenshots and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-cjk-compact-hud-evidence
          path: reports/
          retention-days: 7
      - name: Commit verified official font + OFL to the feature branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/fonts/NotoSansCJKsc-Regular.otf art/licenses/noto_sans_cjk_ofl.txt art/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "art(n07): bundle verified SIL-OFL Noto Sans CJK SC 2.004"
            git push origin HEAD:fix/n07-phase0-cjk-compact-hud
          fi
