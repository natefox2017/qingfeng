name: P0 expanded farm native proof
on:
  push:
    branches: [feat/p0-approved-art-world-expand]
permissions:
  contents: read
concurrency:
  group: expanded-farm-p0
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema and Python tools
        run: |
          python3 tools/check_scaffold.py
          python3 -m unittest discover -s tools/tests -q
      - name: Install exact Godot 4.7.2 in isolated CI
        run: python3 tools/install_engine.py --directory .local/godot
      - name: Godot Phase0 real walk and interaction
        run: |
          unset GODOT_BIN
          ./run_game.sh --test --report-dir reports/phase0 --timeout 105
      - name: Full Godot gameplay regression
        run: |
          unset GODOT_BIN
          ./run_game.sh --test-all --report-dir reports/runtime --timeout 105
      - name: Render native 1280 and 1920 farm screenshots
        run: |
          mkdir -p reports/native
          xvfb-run -a -s "-screen 0 1920x1080x24" ./run_game.sh --capture "$GITHUB_WORKSPACE/reports/native" | tee reports/capture.log
          test -s reports/native/phase0_farm_1280.png
          test -s reports/native/phase0_farm_1920.png
      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-farm-native-evidence
          path: reports/
          retention-days: 7
