name: PR policy checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# GitHub Free cannot enforce rulesets on this private repository. Do not
# call enablePullRequestAutoMerge during an unfinished required check:
# it repeatedly fails with "Pull request is in unstable status", and auto
# merge without enforced QA would be unsafe. Human review and an actual
# successful validation run remain required before manually merging.
permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Keep the historical check-context name for compatible future protection.
  # This now runs real repository/unit checks instead of a GraphQL mutation.
  repository-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Validate repository contracts
        run: python3 tools/check_scaffold.py
      - name: Execute Python regression tests
        run: python3 -m unittest discover -s tools/tests -v
