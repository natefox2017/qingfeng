name: Auto merge
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keep this exact job name because the active main ruleset requires the
  # repository-policy status context. The job intentionally runs no CI.
  repository-policy:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Enable native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_ID="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .node_id)"
          ENABLED="$(gh api graphql             -f query='query($id: ID!) { node(id: $id) { ... on PullRequest { autoMergeRequest { enabledAt } } } }'             -f id="$PR_ID"             --jq '.data.node.autoMergeRequest.enabledAt // ""')"
          if [ -z "$ENABLED" ]; then
            gh api graphql               -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }'               -f id="$PR_ID" >/dev/null
          fi
