name: Runtime foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/n05-runtime-foundation]
permissions:
  contents: read
jobs:
  # The active main ruleset requires this exact status context. This job runs
  # real scaffold/unit/cold-import/physics checks; it is not an always-green alias.
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact tested source
        run: |
          mkdir -p reports/runtime
          git rev-parse HEAD > reports/runtime/commit.txt
          git ls-tree -r HEAD > reports/runtime/source-tree.txt
      - name: Scaffold and checker regression
        run: |
          python3 tools/check_scaffold.py
          python3 -m unittest discover -s tools/tests -v
      - name: Install verified official engine
        run: python3 tools/install_engine.py --directory "$RUNNER_TEMP/godot"
      - name: Cold import and native lifecycle/physics tests
        run: python3 tools/runtime.py test --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --report-dir reports/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-foundation-results
          path: reports/runtime
          retention-days: 7
